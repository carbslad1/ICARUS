<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KILL LAYER LAB — ICARUS design toy</title>
<style>
:root{
  --bg:#04131a;--panel:#081f26;--panel2:#0b2830;--line:#15454e;--line2:#1d5a64;
  --ink:#cfe9e6;--dim:#6fa5a0;--faint:#3e6f6b;
  --cyan:#57e6c9;--gold:#f2c14e;--coral:#ff7a6b;--purple:#b78cff;--green:#6fe08a;
  --common:#7fb8b1;--uncommon:#57e6c9;--rare:#f2c14e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020b0f;color:var(--ink);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#072029,#020b0f 70%)}
#stage{position:relative;width:1280px;height:720px;transform-origin:center center;background:#06181e;
  box-shadow:0 0 90px #000c,0 0 0 1px #0e333b;overflow:hidden;user-select:none}
#game{position:absolute;inset:0;width:1280px;height:720px;display:block}
.hidden{display:none !important}
.dim{color:var(--dim)}
.gold{color:var(--gold)}
.cyan{color:var(--cyan)}
.coral{color:var(--coral)}

/* ---------- buttons ---------- */
button{font-family:inherit;color:var(--ink);background:#0d303a;border:1px solid var(--line2);
  border-radius:8px;padding:8px 13px;font-size:12px;letter-spacing:.06em;cursor:pointer;transition:all .12s}
button:hover:not(:disabled){background:#124451;border-color:var(--cyan);color:#eafffb}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:linear-gradient(180deg,#1a7b6c,#10564c);border-color:var(--cyan);color:#eafffb;
  font-weight:700;font-size:15px;letter-spacing:.12em;padding:12px 26px}
button.primary:hover:not(:disabled){background:linear-gradient(180deg,#229a86,#157064)}
button.small{padding:5px 9px;font-size:11px}
button.buy{width:100%;background:#123c46;border-color:var(--line2)}
button.buy:hover:not(:disabled){background:#17515e}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- title ---------- */
#screen{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#1d5a64 transparent}
#screen::-webkit-scrollbar{width:8px}
#screen::-webkit-scrollbar-thumb{background:#1d5a64;border-radius:4px}
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:40px 80px;text-align:center;
  background:radial-gradient(circle at 50% 10%,#0b333d 0%,transparent 55%)}
.title .eyebrow{font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.42em;color:var(--cyan)}
.title h1{margin:0;font-size:82px;line-height:.92;letter-spacing:.02em;font-weight:800;color:#eafffb;
  text-shadow:0 0 40px #57e6c955,0 4px 0 #06262d}
.title h1 span{color:var(--gold)}
.title .sub{max-width:760px;font-size:18px;line-height:1.5;color:#a8d4cf}
.title .sub b{color:var(--cyan)}
.title .how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:960px;margin-top:4px}
.title .how div{border:1px solid var(--line);border-radius:10px;background:#071f26cc;padding:14px 16px;
  text-align:left;font-size:13px;line-height:1.45;color:#9dc8c3}
.title .how b{display:block;color:var(--gold);font:700 11px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.14em;margin-bottom:6px}
.title .beginrow{display:flex;gap:14px;align-items:center;margin-top:10px}
.title .tiny{font-size:11px;color:var(--faint);letter-spacing:.08em}
.title .thesis{font:italic 15px/1.5 Georgia,serif;color:#8fc4be;max-width:820px}
.kbd{display:inline-block;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;
  background:#0b2b33;padding:0 5px;font:600 10px/16px ui-monospace,Menlo,monospace;color:var(--dim)}

/* ---------- shop ---------- */
.shop{min-height:100%;display:flex;flex-direction:column;padding:16px 18px 14px;gap:12px}
.shop-head{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand-sm{font:800 20px/1 system-ui;letter-spacing:.08em;color:#eafffb}
.brand-sm i{font-style:normal;color:var(--gold)}
.resources{display:flex;gap:18px;margin-left:auto;align-items:center;font:600 13px/1 ui-monospace,Menlo,monospace}
.res{display:flex;gap:6px;align-items:baseline;color:var(--dim)}
.res b{font-size:17px;color:#eafffb}
.res.gold b{color:var(--gold)}
.res.hp b{color:var(--green)}
.head-actions{display:flex;gap:8px}
.shop-grid{flex:1;display:grid;grid-template-columns:352px 1fr 430px;gap:14px;min-height:0}
.panel{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#08222a,#071b21);
  padding:13px 14px;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#1d5a64 transparent}
.panel::-webkit-scrollbar{width:7px}
.panel::-webkit-scrollbar-thumb{background:#1d5a64;border-radius:4px}
.panel h2{margin:0 0 8px;font:700 11px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--cyan)}
.panel h2 small{color:var(--faint);letter-spacing:.06em;font-weight:400;text-transform:none;font-family:inherit}
.panel h2:not(:first-child){margin-top:16px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{position:relative;aspect-ratio:1/1.18;border:1px dashed #1c4f58;border-radius:9px;background:#061a20;
  display:flex;align-items:center;justify-content:center;transition:border-color .1s,background .1s}
.slot .slot-i{font:600 10px/1 ui-monospace;color:#2c5f63}
.slot.filled{border-style:solid;border-color:#235d66;background:#0a2931}
.slot.drop{border-color:var(--gold);background:#123a3a;box-shadow:0 0 0 2px #f2c14e55 inset}
.chip{width:100%;height:100%;border-radius:8px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:grab;position:relative;padding:2px;background:transparent}
.chip:active{cursor:grabbing}
.chip .glyph{font-size:24px;line-height:1;color:#eafffb}
.chip .nm{font:600 8.5px/1.1 ui-monospace,Menlo,monospace;letter-spacing:.02em;color:var(--dim);
  text-align:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.r-common .glyph{color:#9fd7cf}.chip.r-uncommon .glyph{color:var(--cyan)}.chip.r-rare .glyph{color:var(--gold)}
.chip .sell{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;padding:0;
  font:700 10px/15px ui-monospace;background:#3a1717;border:1px solid #7d3a34;color:#ffb3a8;opacity:0}
.chip:hover .sell{opacity:1}
.sell-bin{margin-top:10px;border:1px dashed #59343a;border-radius:9px;padding:9px;text-align:center;
  font:600 10px/1.3 ui-monospace;letter-spacing:.14em;color:#b07a70;background:#1a0e10}
.sell-bin.drop{border-color:var(--coral);color:var(--coral);background:#2a1215}
.hint{font-size:11px;line-height:1.5;color:var(--faint);margin:10px 0 0}
.offers{display:flex;flex-direction:column;gap:10px}
.offer{border:1px solid var(--line);border-radius:11px;background:#0a272f;padding:11px 12px}
.offer.r-common{border-left:3px solid var(--common)}
.offer.r-uncommon{border-left:3px solid var(--uncommon)}
.offer.r-rare{border-left:3px solid var(--rare);background:linear-gradient(180deg,#1d2417,#0a272f)}
.offer-top{display:flex;align-items:center;justify-content:space-between}
.offer .glyph{font-size:26px;line-height:1}
.offer .rarity{font:700 9px/1 ui-monospace;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.offer.r-rare .rarity{color:var(--gold)}
.offer-name{font-weight:700;font-size:15px;margin-top:3px}
.offer .kind{font:600 9px/1 ui-monospace;letter-spacing:.16em;color:var(--dim);margin:3px 0 5px}
.offer p{margin:0 0 9px;font-size:11.5px;line-height:1.45;color:#9dc8c3;min-height:32px}
.rule-line{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:11px;color:var(--faint);line-height:1.5}
.rule-line b{color:var(--dim)}
.fcast{border:1px solid var(--line);border-radius:8px;background:#061a20;padding:8px 9px;margin-bottom:9px}
.fc-row{font:500 9.5px/1.45 ui-monospace,Menlo,monospace;color:#8fc0ba;display:grid;grid-template-columns:66px 1fr;gap:6px;margin-bottom:3px}
.fc-row span{font:700 8px/1.5 ui-monospace;letter-spacing:.1em;color:var(--faint)}
.fc-row b{color:var(--gold)}
.shop-foot{display:flex;align-items:center;gap:16px}
.foot-note{font-size:11px;color:var(--faint);letter-spacing:.05em;flex:1}

/* ---------- report ---------- */
.report-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.report-head .wk{font:800 16px/1 system-ui;color:#eafffb}
.report-head .sub{font:600 10px/1 ui-monospace;color:var(--faint);letter-spacing:.1em;margin-left:auto}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stat{border:1px solid var(--line);border-radius:8px;background:#061a20;padding:7px 9px}
.stat b{display:block;font:700 17px/1.1 ui-monospace,Menlo,monospace;color:#eafffb}
.stat span{font:600 8.5px/1 ui-monospace;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.stat.gold b{color:var(--gold)}.stat.cyan b{color:var(--cyan)}.stat.coral b{color:var(--coral)}
table.attr{width:100%;border-collapse:collapse;font-size:10.5px}
table.attr th{font:700 8.5px/1.3 ui-monospace;letter-spacing:.1em;color:var(--faint);text-align:right;
  padding:3px 4px;border-bottom:1px solid var(--line);text-transform:uppercase}
table.attr th:first-child{text-align:left}
table.attr td{padding:4px;border-bottom:1px solid #0d2c33;text-align:right;vertical-align:top;
  font:500 10.5px/1.35 ui-monospace,Menlo,monospace;color:#a8d4cf}
table.attr td:first-child{text-align:left;font-family:inherit;font-weight:600;color:var(--ink)}
table.attr td .g{font-size:15px;margin-right:4px;vertical-align:-1px}
table.attr td.did{text-align:left;font:400 9px/1.3 system-ui;color:var(--faint);max-width:none;padding-left:2px}
table.attr td .did{display:block;font:400 8.5px/1.3 system-ui;color:var(--faint);margin-top:2px;white-space:normal}
table.attr tr.dead td{opacity:.45}
.fuel{margin-top:12px}
.fuel-row{display:grid;grid-template-columns:72px 1fr 42px;gap:6px;align-items:center;margin-bottom:4px;
  font:600 9px/1 ui-monospace;color:var(--dim);letter-spacing:.05em}
.fuel-bar{height:8px;border-radius:4px;background:#0a262c;overflow:hidden;border:1px solid #123940}
.fuel-bar i{display:block;height:100%;border-radius:3px}
.fuel-row .v{text-align:right;color:var(--ink)}
.fuel-row.overkill .fuel-bar i{background:#ff7a6b}
.fuel-row.bigHP .fuel-bar i{background:#b78cff}
.fuel-row.family .fuel-bar i{background:#6fe08a}
.fuel-row.pace .fuel-bar i{background:#57e6c9}
.fuel-row.safe .fuel-bar i{background:#f2c14e}
.fuel-row.base .fuel-bar i{background:#40606a}
.fuel-row.generic .fuel-bar i{background:#7fb8b1}
.cmp{margin-top:14px;border-top:1px solid var(--line);padding-top:11px}
.cmp h3{margin:0 0 5px;font:700 10px/1.2 ui-monospace;letter-spacing:.16em;color:var(--gold)}
.cmp p{margin:0 0 8px;font-size:10.5px;line-height:1.45;color:var(--faint)}
.cmp .prog{height:6px;border-radius:3px;background:#0a262c;overflow:hidden;margin:8px 0 4px}
.cmp .prog i{display:block;height:100%;background:linear-gradient(90deg,#57e6c9,#f2c14e)}
.cmp .pnum{font:600 9px/1 ui-monospace;color:var(--dim);letter-spacing:.08em}
.cmp-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}
.cmp-stat{border:1px solid var(--line);border-radius:7px;background:#061a20;padding:6px 8px}
.cmp-stat b{display:block;font:700 15px/1.1 ui-monospace;color:#eafffb}
.cmp-stat span{font:600 8px/1 ui-monospace;letter-spacing:.1em;color:var(--faint)}
.order-line{display:flex;align-items:center;gap:3px;font-size:15px;line-height:1;margin:4px 0}
.order-line .g{color:#bfe9e4}
.order-line .empty{color:#2c5f63}
.order-line .lbl{font:700 8px/1 ui-monospace;letter-spacing:.12em;color:var(--faint);width:34px}
.cmp .best{color:var(--cyan)}.cmp .worst{color:var(--coral)}
.cmp .you{color:var(--gold)}
.cmp-note{font:400 9.5px/1.45 system-ui;color:var(--faint);margin-top:5px}
.placeholder{color:var(--faint);font-size:12px;line-height:1.6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;height:100%;text-align:center;gap:8px;padding:20px}
.placeholder .big{font-size:34px;opacity:.5}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:flex-start;gap:14px}
.hud-wave{font:800 22px/1 system-ui;color:#eafffb;letter-spacing:.02em}
.hud-wave small{display:block;font:600 9px/1.4 ui-monospace;letter-spacing:.2em;color:var(--dim);margin-top:4px}
.hud-stats{display:flex;gap:9px;margin-left:8px}
.hud-stat{border:1px solid #15505a;border-radius:7px;background:#071f26cc;padding:5px 9px;min-width:64px;
  backdrop-filter:blur(2px)}
.hud-stat b{display:block;font:700 16px/1.1 ui-monospace,Menlo,monospace;color:#eafffb}
.hud-stat span{font:600 7.5px/1 ui-monospace;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.hud-right{margin-left:auto;display:flex;gap:7px;pointer-events:auto;align-items:flex-start}
.hpbox{position:absolute;left:16px;top:74px;width:250px}
.hpbar{height:13px;border-radius:7px;border:1px solid #265a52;background:#0a1d1c;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#2fbf7c,#6fe08a);transition:width .08s linear}
.hpbar.low i{background:linear-gradient(90deg,#c9443a,#ff7a6b)}
.hplabel{display:flex;justify-content:space-between;font:700 9px/1.5 ui-monospace;letter-spacing:.1em;
  color:var(--dim);margin-bottom:3px}
.barrier{display:flex;gap:3px;margin-top:5px}
.barrier i{width:16px;height:8px;border-radius:2px;background:#0f2e33;border:1px solid #1d5a64}
.barrier i.on{background:#57e6c9;box-shadow:0 0 8px #57e6c9aa}
.hud-time{position:absolute;left:50%;top:16px;transform:translateX(-50%);text-align:center}
.hud-time b{display:block;font:700 15px/1 ui-monospace;color:var(--gold);letter-spacing:.1em}
.hud-time span{display:block;font:600 8px/1.5 ui-monospace;letter-spacing:.2em;color:var(--faint);margin-top:3px}
.combat-note{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);font:600 10px/1 ui-monospace;
  letter-spacing:.2em;color:#3f7772;pointer-events:none}
#debug{position:absolute;right:16px;bottom:16px;background:#020d10dd;border:1px solid #15505a;border-radius:8px;
  padding:8px 10px;font:500 10px/1.55 ui-monospace,Menlo,monospace;color:#7fc3bc;white-space:pre;pointer-events:none}
#debug b{color:var(--cyan)}
.deathvignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 30%,#7a1414aa);pointer-events:none}
.hurtflash{position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,#ff3a2a55);pointer-events:none;opacity:0}

/* ---------- run over ---------- */
.runover{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:30px 60px;text-align:center}
.runover .eyebrow{font:700 12px/1 ui-monospace;letter-spacing:.36em;color:var(--coral)}
.runover.win .eyebrow{color:var(--cyan)}
.runover h1{margin:0;font:800 56px/1 system-ui;letter-spacing:.03em;color:#eafffb}
.runover .sub{font-size:15px;color:#9dc8c3;max-width:720px;line-height:1.5}
.runover .totals{display:flex;gap:12px;margin:6px 0}
.runover .tot{min-width:128px;border:1px solid var(--line);border-radius:10px;background:#071f26cc;padding:10px 14px}
.runover .tot b{display:block;font:800 26px/1.1 ui-monospace;color:#eafffb}
.runover .tot.gold b{color:var(--gold)}.runover .tot.cyan b{color:var(--cyan)}
.runover .tot span{font:600 8.5px/1.4 ui-monospace;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.runover .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:980px;text-align:left}
.runover .card{border:1px solid var(--line);border-radius:11px;background:#071f26cc;padding:12px 14px;min-height:60px}
.runover .card h3{margin:0 0 8px;font:700 10px/1.2 ui-monospace;letter-spacing:.16em;color:var(--cyan)}
.runover .card table{width:100%;border-collapse:collapse;font:500 10px/1.5 ui-monospace}
.runover .card th{font:700 8px/1.4 ui-monospace;letter-spacing:.1em;color:var(--faint);text-align:right;
  border-bottom:1px solid var(--line);padding:2px 3px}
.runover .card th:first-child{text-align:left}
.runover .card td{padding:2px 3px;border-bottom:1px solid #0d2c33;text-align:right;color:#a8d4cf}
.runover .card td:first-child{text-align:left;font-family:inherit;color:var(--ink)}
.runover .acts{display:flex;gap:12px;align-items:center;margin-top:6px}

</style>
</head>
<body>
<div id="shell"><div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="boot">KILL LAYER LAB — loading…</div>
  <div id="screen" class="hidden"></div>
  <div id="hud" class="hidden"></div>
  <div id="debug" class="hidden"></div>
</div></div>
<script>
/* ==== SIM START ==== */
(function (global) {
'use strict';

/* ------------------------------------------------------------------ *
 * KILL LAYER LAB — pure simulation core.
 * No DOM, no Math.random, no clock. Fixed 20 Hz step. mulberry32 PRNG.
 * simulate({wave, rack, seed, upgrades, hp, maxSeconds, record})
 * ------------------------------------------------------------------ */

const ARENA = { w: 1280, h: 720 };
const DT = 1 / 20;
const PLAYER_R = 14;
const PLAYER_SPEED = 220;
const PLAYER_HP = 100;
const CONTACT_DMG = 7;
const INVULN = 0.6;
const BARRIER_ABSORB = 6;
const BARRIER_MAX = 5;
const GUN_BASE_DMG = 22;
const GUN_CD = 0.45;
const GUN_RANGE = 600;
const GUNS = 2;
const ENEMY_CAP = 110;
const WAVE_CAP = 48;
const ECHO_DMG = 0.4;      // share of the killed enemy's max HP
const GALE_DMG = 0.25;     // weak echo
const GALE_PUSH = 60;
const DEPTH_MAX = 8;
const ECHO_RATE = 40;      // echo events per second, global
const ECHO_BURST = 8;      // token bucket capacity
const BANK_RATE = 0.25;    // chain -> pearls, 4:1, at the end of the row

const FAMILIES = {
  fruit: { key: 'fruit', name: 'Fruit', glyph: '●', color: '#6fe08a', weight: 60, hp: 1.0, speed: 1.0, r: 12 },
  bell:  { key: 'bell',  name: 'Bell',  glyph: '♪', color: '#e8c85c', weight: 20, hp: 1.3, speed: 1.05, r: 12 },
  chest: { key: 'chest', name: 'Chest', glyph: '▭', color: '#e0765c', weight: 16, hp: 2.0, speed: 0.72, r: 14 },
  seven: { key: 'seven', name: 'Seven', glyph: '7', color: '#b78cff', weight: 4,  hp: 1.5, speed: 1.1, r: 12 },
};
const FAM_KEYS = ['fruit', 'bell', 'chest', 'seven'];
const FAM_INDEX = { fruit: 0, bell: 1, chest: 2, seven: 3 };

/* The rack. Sources (S) grow chain, sinks (K) spend it, order items (O) reroute it.
   Numbers are invented for the toy; see LAB_NOTES.md for what was tuned off-spec. */
const ITEMS = {
  sonar: {
    name: 'Sonar', glyph: '◉', kind: 'S', rarity: 'common', fuel: 'generic', price: 8,
    blurb: '+1 chain on every kill', short: '+1 chain',
    src: (chain) => chain + 1,
  },
  undertow: {
    name: 'Undertow', glyph: '⇊', kind: 'S', rarity: 'uncommon', fuel: 'generic', price: 14,
    blurb: '×2 chain', short: '×2 chain',
    src: (chain) => chain * 2,
  },
  prism: {
    name: 'Prism', glyph: '◆', kind: 'S', rarity: 'rare', fuel: 'generic', price: 22,
    blurb: '×2 chain (rare)', short: '×2 chain',
    src: (chain) => chain * 2,
  },
  harpoon: {
    name: "Harpoon's Gift", glyph: '⚔', kind: 'S', rarity: 'common', fuel: 'overkill', price: 8,
    blurb: 'overkill feeds chain', short: 'overkill → chain',
    src: (chain, p) => chain + Math.min(5, Math.floor(p.over / (p.maxHP * 0.2))),
  },
  biggame: {
    name: 'Big Game', glyph: '⛰', kind: 'S', rarity: 'uncommon', fuel: 'bigHP', price: 14,
    blurb: 'tanky kills feed chain', short: 'tanky → chain',
    src: (chain, p, S) => chain + Math.min(3, Math.floor(p.maxHP / (10 + S.wave))),
  },
  fruitbloom: {

  overflow: {

  },

const ITEM_IDS = Object.keys(ITEMS);
const KIND_LABEL = { S: 'SOURCE', K: 'SINK', O: 'ORDER' };

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function padRack(order) {
  const r = [null, null, null, null, null, null];
  (order || []).slice(0, 6).forEach((id, i) => { r[i] = id || null; });
  return r;
}
function waveLength(wave) { return Math.min(WAVE_CAP, 20 + 2 * (wave - 1)); }
function spawnRate(wave) { return Math.min(10, 5.2 + 0.6 * (wave - 1)); }
function enemyBaseHP(wave) { return 6 * Math.pow(1.19, wave - 1); }
function enemySpeed(wave) { return Math.min(120, 52 + 2.2 * (wave - 1)); }

function newStats() {
  const perSlot = [];
  for (let i = 0; i < 6; i++) {
    perSlot.push({ id: null, seen: 0, fires: 0, added: 0, spent: 0, echo: 0, gale: 0, barrier: 0, pearls: 0, hollow: 0, orderCount: 0, copyCount: 0, copiesOf: {} });
  }
  return { perSlot, fuel: { base: 0, overkill: 0, bigHP: 0, family: 0, pace: 0, safe: 0, generic: 0 } };
}
function addFuel(S, tag, amount) {
  if (!(tag in S.stats.fuel)) tag = 'base';
  S.stats.fuel[tag] += amount;
}

function createSim(o) {
  const wave = o.wave;
  const step = o.step == null ? DT : o.step;
  const S = {
    wave, seed: o.seed >>> 0, rng: mulberry32(o.seed >>> 0), t: 0, dt: step,
    echoRegen: Math.max(1, Math.round(ECHO_RATE * step)),
    duration: Math.min(waveLength(wave), o.maxSeconds == null ? waveLength(wave) : o.maxSeconds),
    rack: padRack(o.rack),
    upgrades: { gunDamage: (o.upgrades && o.upgrades.gunDamage) || 0 },
    record: !!o.record,
    player: { x: ARENA.w / 2, y: ARENA.h / 2, hp: o.hp == null ? PLAYER_HP : Math.min(PLAYER_HP, Math.max(1, o.hp)), invuln: 0, barrier: 0 },
    enemies: [], nextId: 1, spawnAcc: 0,
    kills: 0, gunKills: 0, echoKills: 0, echoEvents: 0, echoesByTick: 0,
    pearlsWave: 0, vaultPearls: 0, barrierUsed: 0,
    chainSum: 0, chainMax: 0, chainTotal: 0,
    maxEnemies: 0, maxDepth: 0, maxCascade: 0, bestCascadeAt: -1,
    lastKillT: -999,
    guns: [0, 0],
    echoBudget: ECHO_BURST,
    stats: newStats(),
    rootSeq: 0, rootCount: {},
    damageDealt: 0,
    dead: false, deathT: -1,
    events: [], frames: [],
    _chain: 1,
    killsByFamily: { fruit: 0, bell: 0, chest: 0, seven: 0 },
  };
  return S;
}

function nearestEnemy(S, x, y, maxDist) {
  let best = null, bd = maxDist == null ? Infinity : maxDist * maxDist;
  for (let k = 0; k < S.enemies.length; k++) {
    const e = S.enemies[k];
    const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function spawnEnemy(S) {
  let roll = S.rng() * 100, acc = 0, famKey = 'fruit';
  for (let k = 0; k < FAM_KEYS.length; k++) {
    acc += FAMILIES[FAM_KEYS[k]].weight;
    if (roll <= acc) { famKey = FAM_KEYS[k]; break; }
  }
  const fam = FAMILIES[famKey];
  const edge = Math.floor(S.rng() * 4);
  const along = 30 + S.rng() * (edge < 2 ? ARENA.h - 60 : ARENA.w - 60);
  let x, y;
  if (edge === 0) { x = -18; y = along; }
  else if (edge === 1) { x = ARENA.w + 18; y = along; }
  else if (edge === 2) { x = along; y = -18; }
  else { x = along; y = ARENA.h + 18; }
  const e = {
    id: S.nextId++, family: famKey, x, y,
    maxHP: enemyBaseHP(S.wave) * fam.hp, hp: enemyBaseHP(S.wave) * fam.hp,
    speed: enemySpeed(S.wave) * fam.speed, r: fam.r, flash: 0,
  };
  S.enemies.push(e);
  if (S.record) S.events.push({ type: 'spawn', t: S.t, id: e.id, family: famKey, x, y });
  if (S.enemies.length > S.maxEnemies) S.maxEnemies = S.enemies.length;
  return e;
}

function pilot(S, dt) {
  // deterministic crowd-avoiding pilot: repel from nearby bodies, circle-strafe, stay off the walls
  const p = S.player;
  let ax = 0, ay = 0, near = 0;
  for (let k = 0; k < S.enemies.length; k++) {
    const e = S.enemies[k];
    const dx = p.x - e.x, dy = p.y - e.y;
    const d2 = dx * dx + dy * dy;
    if (d2 > 230 * 230) continue;
    const d = Math.sqrt(d2) || 0.001;
    const w = (230 - d) / 230;
    ax += dx / d * w * w * 3.2;
    ay += dy / d * w * w * 3.2;
    // tangential slip so it slides around a crowd instead of backing into it
    ax += -dy / d * w * 0.9;
    ay += dx / d * w * 0.9;
    near++;
  }
  // mild pull to the middle so the kite path stays inside the arena
  ax += (ARENA.w / 2 - p.x) / ARENA.w * 0.55;
  ay += (ARENA.h / 2 - p.y) / ARENA.h * 0.55;
  const m = 90;
  if (p.x < m) ax += (m - p.x) / m * 4.0;
  if (p.x > ARENA.w - m) ax -= (p.x - (ARENA.w - m)) / m * 4.0;
  if (p.y < m) ay += (m - p.y) / m * 4.0;
  if (p.y > ARENA.h - m) ay -= (p.y - (ARENA.h - m)) / m * 4.0;
  const len = Math.hypot(ax, ay);
  if (len > 0.0001) {
    p.x = clamp(p.x + ax / len * PLAYER_SPEED * dt, PLAYER_R + 4, ARENA.w - PLAYER_R - 4);
    p.y = clamp(p.y + ay / len * PLAYER_SPEED * dt, PLAYER_R + 4, ARENA.h - PLAYER_R - 4);
  }
}

function damagePlayer(S, amount, t) {
  const p = S.player;
  let dmg = amount;
  if (p.barrier > 0) {
    const need = Math.ceil(dmg / BARRIER_ABSORB);
    const use = Math.min(p.barrier, need);
    const absorb = Math.min(dmg, use * BARRIER_ABSORB);
    dmg -= absorb;
    p.barrier -= use;
    S.barrierUsed += absorb;
  }
  p.hp -= dmg;
  p.invuln = INVULN;
  if (S.record) S.events.push({ type: 'hurt', t, dmg, hp: p.hp, barrier: p.barrier });
  if (p.hp <= 0) {
    p.hp = 0;
    S.dead = true;
    S.deathT = t;
    if (S.record) S.events.push({ type: 'death', t, x: p.x, y: p.y });
  }
}

function killEnemy(S, e, over, source, depth, t, rootIn) {
  const idx = S.enemies.indexOf(e);
  if (idx < 0) return;
  S.enemies.splice(idx, 1);
  S.kills++;
  S.killsByFamily[e.family]++;
  if (source === 'echo') S.echoKills++; else S.gunKills++;
  if (depth > S.maxDepth) S.maxDepth = depth;

  let root;
  if (source === 'gun') {
    root = ++S.rootSeq;
    S.rootCount[root] = 1;
  } else {
    root = rootIn;
    S.rootCount[root] = (S.rootCount[root] || 1) + 1;
    const cascade = S.rootCount[root] - 1;
    if (cascade > S.maxCascade) { S.maxCascade = cascade; S.bestCascadeAt = t; }
  }

  const packet = {
    chain: 1, maxHP: e.maxHP, over: Math.max(0, over), family: e.family,
    dtGap: t - S.lastKillT, hp: S.player.hp / PLAYER_HP, depth, source,
    x: e.x, y: e.y, root,
  };
  S.lastKillT = t;
  const rep = resolvePacket(S, packet, t);
  S.chainSum += rep.chain;
  S.chainTotal += rep.chain;
  if (rep.chain > S.chainMax) S.chainMax = rep.chain;
  if (S.record) {
    S.events.push({
      type: 'kill', t, x: e.x, y: e.y, family: e.family, chain: rep.chain,
      left: rep.final, slots: rep.slots, depth, source, root, pearls: rep.pearls, bank: rep.bank,
    });
  }
}

function emitEcho(S, packet, kind, t) {
  if (packet.depth >= DEPTH_MAX) return;
  const target = nearestEnemy(S, packet.x, packet.y, null);
  if (!target) return;
  const base = kind === 'gale' ? GALE_DMG : ECHO_DMG;
  const dmg = base * packet.maxHP * Math.pow(0.8, packet.depth);
  S.echoEvents++;
  if (S.record) {
    S.events.push({
      type: 'echo', t, fromX: packet.x, fromY: packet.y, toX: target.x, toY: target.y,
      dmg, depth: packet.depth, kind, root: packet.root, family: packet.family,
    });
  }
  if (kind === 'gale') {
    const dx = target.x - packet.x, dy = target.y - packet.y, d = Math.hypot(dx, dy) || 1;
    target.x = clamp(target.x + dx / d * GALE_PUSH, 16, ARENA.w - 16);
    target.y = clamp(target.y + dy / d * GALE_PUSH, 16, ARENA.h - 16);
  }
  const before = target.hp;
  target.hp -= dmg;
  S.damageDealt += Math.min(dmg, before);
  if (target.hp <= 0) killEnemy(S, target, dmg - before, 'echo', packet.depth + 1, t, packet.root);
}

function applySlot(S, slotIdx, itemId, packet, t, sr, statIdx, ctx) {
  const it = ITEMS[itemId];
  const st = S.stats.perSlot[statIdx];
  if (!it) return null;

  if (it.kind === 'S') {
    const before = ctx.chain;
    ctx.chain = it.src(ctx.chain, packet, S);
    const added = ctx.chain - before;
    if (added > 0) {
      st.added += added; st.fires++; sr.added += added;
      addFuel(S, it.fuel, added);
    } else {
      st.hollow++; sr.hollow = true;
    }
    return null;
  }

  if (it.kind === 'O') {
    st.fires++;
    if (it.order === 'double') {
      st.orderCount++; sr.order = 'double';
      return { doubleNext: true };
    }
    // copy
    if (slotIdx > 0 && S.rack[slotIdx - 1]) {
      st.copyCount++;
      const prevId = S.rack[slotIdx - 1];
      st.copiesOf[prevId] = (st.copiesOf[prevId] || 0) + 1;
      sr.order = 'copy';
      return { mirror: slotIdx - 1 };
    }
    st.hollow++; sr.hollow = true;
    return null;
  }

  // sink
  let cap = it.maxTake;
  if (it.out === 'barrier') {
    const room = BARRIER_MAX - S.player.barrier;
    cap = Math.min(cap, room * it.per);
  }
  const take = Math.min(ctx.chain, cap);
  const want = Math.floor(take / it.per);
  let done = 0;
  if (it.out === 'echo' || it.out === 'gale') {
    done = Math.min(want, S.echoBudget);
    S.echoBudget -= done;
    if (done > 0) {
      ctx.chain -= done * it.per;
      for (let k = 0; k < done; k++) emitEcho(S, packet, it.out === 'gale' ? 'gale' : 'echo', t);
    }
  } else if (it.out === 'barrier') {
    done = want;
    if (done > 0) { ctx.chain -= done * it.per; S.player.barrier += done; }
  } else if (it.out === 'pearl') {
    done = want;
    if (done > 0) { ctx.chain -= done * it.per; S.pearlsWave += done * it.pearlsPer; }
  } else if (it.out === 'vault') {
    done = want;
    if (done > 0) { ctx.chain -= done * it.per; S.vaultPearls += done * it.pearlsPer; }
  }
  if (done > 0) {
    const spent = done * it.per;
    st.spent += spent; st.fires++; sr.spent += spent; sr.out += done;
    if (it.out === 'echo') { st.echo += done; sr.echo = (sr.echo || 0) + done; }
    else if (it.out === 'gale') { st.gale += done; sr.gale = (sr.gale || 0) + done; }
    else if (it.out === 'barrier') { st.barrier += done; sr.barrier = (sr.barrier || 0) + done; }
    else { const gain = done * it.pearlsPer; st.pearls += gain; sr.pearls = (sr.pearls || 0) + gain; if (it.out === 'vault') sr.vault = gain; }
  } else {
    st.hollow++; sr.hollow = true;
  }
  return null;
}

function resolvePacket(S, packet, t) {
  const ctx = { chain: 1 };
  addFuel(S, 'base', 1);
  const slots = new Array(6).fill(null);
  let doubleNext = false;
  let pearls = 0;
  let peak = 1;
  for (let i = 0; i < 6; i++) {
    const id = S.rack[i];
    if (!id) continue;
    const it = ITEMS[id];
    const st = S.stats.perSlot[i];
    st.id = id; st.seen++;
    const sr = {
      i, id, glyph: it.glyph, kind: it.kind, added: 0, spent: 0, out: 0,
      hollow: false, order: null, chainBefore: ctx.chain, times: 1,
    };
    const runs = doubleNext ? 2 : 1;
    doubleNext = false;
    sr.times = runs;
    let mirrorIdx = -1;
    for (let r = 0; r < runs; r++) {
      const res = applySlot(S, i, id, packet, t, sr, i, ctx);
      if (res) {
        if (res.doubleNext) doubleNext = true;
        if (res.mirror != null && res.mirror >= 0) mirrorIdx = res.mirror;
      }
    }
    if (mirrorIdx >= 0 && S.rack[mirrorIdx]) {
      applySlot(S, mirrorIdx, S.rack[mirrorIdx], packet, t, sr, i, ctx);
    }
    if (ctx.chain > peak) peak = ctx.chain;
    sr.chainAfter = ctx.chain;
    pearls += sr.pearls || 0;
    slots[i] = sr;
  }
  const chain = ctx.chain;
  const bank = chain * BANK_RATE;
  S.pearlsWave += bank;
  return { chain: peak, final: chain, slots, bank, pearls: pearls + bank };
}

function recordFrame(S) {
  const p = S.player;
  const en = new Array(S.enemies.length);
  for (let k = 0; k < S.enemies.length; k++) {
    const e = S.enemies[k];
    en[k] = [e.id, e.x, e.y, Math.max(0, e.hp / e.maxHP), FAM_INDEX[e.family]];
  }
  S.frames.push({
    t: S.t, px: p.x, py: p.y, hp: p.hp, bar: p.barrier,
    inv: p.invuln > 0 ? 1 : 0, flash: 0, e: en,
  });
}

function step(S) {
  const dt = S.dt;
  S.t += dt;
  S.echoBudget = Math.min(ECHO_BURST, S.echoBudget + S.echoRegen);

  // spawns
  S.spawnAcc += spawnRate(S.wave) * dt;
  while (S.spawnAcc >= 1) {
    S.spawnAcc -= 1;
    if (S.enemies.length < ENEMY_CAP) spawnEnemy(S);
  }

  // pilot
  pilot(S, dt);

  // enemies chase + contact
  const p = S.player;
  if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
  for (let k = S.enemies.length - 1; k >= 0; k--) {
    const e = S.enemies[k];
    let dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > e.r + PLAYER_R) {
      e.x += dx / d * e.speed * dt;
      e.y += dy / d * e.speed * dt;
    } else if (p.invuln <= 0) {
      damagePlayer(S, CONTACT_DMG, S.t);
      // little knock apart so contact is not a constant grind
      const kb = 16;
      e.x -= dx / d * kb; e.y -= dy / d * kb;
      p.x += dx / d * kb * 0.4; p.y += dy / d * kb * 0.4;
      p.x = clamp(p.x, PLAYER_R + 4, ARENA.w - PLAYER_R - 4);
      p.y = clamp(p.y, PLAYER_R + 4, ARENA.h - PLAYER_R - 4);
      if (S.dead) break;
    }
  }

  // guns
  if (!S.dead) {
    const dmg = GUN_BASE_DMG + S.upgrades.gunDamage;
    for (let g = 0; g < GUNS; g++) {
      if (S.guns[g] > 0) { S.guns[g] -= dt; continue; }
      const target = nearestEnemy(S, p.x, p.y, GUN_RANGE);
      if (!target) continue;
      S.guns[g] = GUN_CD;
      const gx = p.x + (g === 0 ? -9 : 9), gy = p.y - 7;
      if (S.record) S.events.push({ type: 'shot', t: S.t, x1: gx, y1: gy, x2: target.x, y2: target.y, gun: g });
      const before = target.hp;
      target.hp -= dmg;
      S.damageDealt += Math.min(dmg, before);
      if (target.hp <= 0) killEnemy(S, target, dmg - before, 'gun', 0, S.t, null);
      if (S.dead) break;
    }
  }

  if (S.record) recordFrame(S);
}

function simulate(opts) {
  opts = opts || {};
  const wave = Math.max(1, Math.min(20, opts.wave || 1));
  const S = createSim({
    wave,
    seed: opts.seed == null ? 1 : (opts.seed >>> 0),
    rack: opts.rack || [],
    upgrades: opts.upgrades || {},
    hp: opts.hp,
    maxSeconds: opts.maxSeconds,
    record: opts.record,
    step: opts.step,
  });
  const guard = 30 * 200; // hard ceiling on ticks (never reached in practice)
  let ticks = 0;
  while (S.t < S.duration - 1e-9 && !S.dead && ticks < guard) {
    step(S);
    ticks++;
  }
  if (S.record && !S.frames.length) recordFrame(S);
  const ended = !S.dead && S.t >= S.duration - 1e-9;
  const fuel = Object.assign({}, S.stats.fuel);
  let fuelTotal = 0;
  for (const k in fuel) fuelTotal += fuel[k];
  const perSlot = S.stats.perSlot.map((st) => ({
    id: st.id, seen: st.seen, fires: st.fires, added: st.added, spent: st.spent,
    echo: st.echo, gale: st.gale, barrier: st.barrier, pearls: st.pearls,
    hollow: st.hollow, orderCount: st.orderCount, copyCount: st.copyCount,
    copiesOf: st.copiesOf,
  }));
  return {
    wave, seed: S.seed, duration: S.t, step: S.dt, waveEnded: ended, died: S.dead, deathT: S.deathT,
    kills: S.kills, gunKills: S.gunKills, echoKills: S.echoKills, echoes: S.echoEvents,
    pearls: S.pearlsWave + (ended ? S.vaultPearls : 0),
    pearlsNow: S.pearlsWave, vault: ended ? S.vaultPearls : 0, vaultLost: S.dead ? S.vaultPearls : 0,
    barrierUsed: S.barrierUsed, hpLeft: S.dead ? 0 : S.player.hp,
    maxEnemies: S.maxEnemies, enemiesAtEnd: S.enemies.length, maxDepth: S.maxDepth, maxCascade: S.maxCascade,
    bestCascadeAt: S.bestCascadeAt, chainAvg: S.kills ? S.chainSum / S.kills : 0, chainMax: S.chainMax,
    damageDealt: S.damageDealt,
    perSlot, fuel, fuelTotal,
    killsByFamily: S.killsByFamily,
    events: S.record ? S.events : null,
    frames: S.record ? S.frames : null,
  };
}

/* ------------------------- order comparison ------------------------- */

function uniqueOrders(items) {
  const out = [];
  const used = new Array(items.length).fill(false);
  const cur = [];
  const seen = new Set();
  function rec() {
    if (cur.length === items.length) {
      const key = cur.join('|');
      if (!seen.has(key)) { seen.add(key); out.push(cur.slice()); }
      return;
    }
    for (let i = 0; i < items.length; i++) {
      if (used[i]) continue;
      used[i] = true; cur.push(items[i]);
      rec();
      cur.pop(); used[i] = false;
    }
  }
  rec();
  return out;
}

function permutations(opts) {

  const py = f1 ? py0 + (f1.py - py0) * al : py0;
  const moving = f1 && Math.hypot(f1.px - px0, f1.py - py0) > 0.5;
  if (moving) CB.angle = Math.atan2(f1.py - py0, f1.px - px0);
  drawDolphin(px, py, CB.angle, f0.inv ? 1 : 0);

  // echo chain travel
  for (let i = CB.echoes.length - 1; i >= 0; i--) {
    const e = CB.echoes[i];
    const age = T - e.t;
    if (age > 0.4) { CB.echoes.splice(i, 1); continue; }
    if (age < 0) continue;
    const glyphs = CB.opts.rack.filter(Boolean).map((id) => ITEMS[id].glyph);
    if (age <= 0.12) {
      const p = age / 0.12;
      const x = e.fromX + (e.toX - e.fromX) * p;
      const y = e.fromY + (e.toY - e.fromY) * p;
      const dx = e.toX - e.fromX, dy = e.toY - e.fromY, d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      ctx.globalAlpha = 0.5 + 0.5 * (1 - p);
      ctx.font = '700 13px ui-monospace,Menlo,monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const n = Math.min(4, glyphs.length || 1);
      for (let k = 0; k < n; k++) {
        const gx = x - ux * k * 11, gy = y - uy * k * 11;
        ctx.globalAlpha = (1 - k / (n + 1)) * (0.55 + 0.45 * (1 - p));
        ctx.fillStyle = e.kind === 'gale' ? '#b78cff' : '#8bf5e4';
        ctx.fillText(glyphs[k % glyphs.length] || '✦', gx, gy);
      }
    } else {
      const a = 1 - (age - 0.12) / 0.28;
      ctx.globalAlpha = Math.max(0, a);
      ctx.strokeStyle = e.kind === 'gale' ? '#b78cff' : '#8bf5e4';
      ctx.lineWidth = 2;
      const r = 6 + (age - 0.12) * 90;
      ctx.beginPath(); ctx.arc(e.toX, e.toY, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = Math.max(0, a) * 0.8;
      ctx.fillStyle = e.kind === 'gale' ? '#b78cff' : '#8bf5e4';
      ctx.font = '700 12px ui-monospace,Menlo,monospace';
      ctx.textAlign = 'center';
      ctx.fillText(e.kind === 'gale' ? '≋' : '✦', e.toX, e.toY - 14);
    }
  }
  ctx.globalAlpha = 1;

  // receipts
  for (let i = CB.receipts.length - 1; i >= 0; i--) {
    const r = CB.receipts[i];
    const age = T - r.e.t;
    if (age > 0.62) { CB.receipts.splice(i, 1); continue; }
    if (age < 0) continue;
    const targetStage = Math.min(6, Math.floor(age / 0.035) + 1);
    while (r.stage < targetStage) {
      const sidx = r.stage;
      const slot = r.e.slots[sidx];
      if (slot && (slot.added > 0 || slot.spent > 0 || slot.order)) CB.glows[sidx] = 1;
      if (r.audible && slot && !slot.hollow) AU.note(sidx, ITEMS[slot.id].kind === 'K');
      r.stage++;
    }
    const rowW = 6 * 25;
    const baseX = r.e.x - rowW / 2 + 12;
    for (let s = 0; s < 6; s++) {
      const local = age - s * 0.035;
      if (local < 0) continue;
      const slot = r.e.slots[s];
      const rise = 22 * (1 - Math.exp(-local * 9));
      const alpha = local < 0.3 ? 1 : Math.max(0, 1 - (local - 0.3) / 0.32);
      const x = baseX + s * 25, y = r.e.y - 14 - rise;
      ctx.globalAlpha = alpha * (slot ? 1 : 0.22);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (slot) {
        let mag = Math.max(slot.added || 0, slot.spent || 0, slot.out || 0, slot.order ? 1 : 0);
        const pulse = 1 + Math.min(0.85, mag / 5) * Math.exp(-local * 9) * 0.7;
        ctx.font = `800 ${Math.round(17 * pulse)}px ui-monospace,Menlo,monospace`;
        ctx.fillStyle = slot.order ? '#f2c14e' : ITEMS[slot.id].kind === 'K' ? '#8bf5e4' : '#eafffb';
        ctx.fillText(slot.glyph, x, y);
        if (slot.spent > 0) {
          ctx.globalAlpha = alpha * 0.8;
          ctx.font = '700 8px ui-monospace,Menlo,monospace';
          ctx.fillStyle = '#57e6c9';
          ctx.fillText('−' + Math.round(slot.spent), x, y + 12);
        }
      } else {
        ctx.font = '700 13px ui-monospace,Menlo,monospace';
        ctx.fillStyle = '#2c5f63';
        ctx.fillText('·', x, y);
      }
    }
    // chain total at the row's end
    if (age >= 6 * 0.035 + 0.06) {
      const la = Math.min(1, (age - 6 * 0.035 - 0.06) * 6) * (age > 0.34 ? Math.max(0, 1 - (age - 0.34) / 0.28) : 1);
      ctx.globalAlpha = Math.max(0, la);
      ctx.font = '800 20px ui-monospace,Menlo,monospace';
      ctx.fillStyle = '#f2c14e'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(fmt(r.e.chain), baseX + rowW + 12, r.e.y - 22);
      ctx.font = '700 7px ui-monospace,Menlo,monospace';
      ctx.fillStyle = '#6fa5a0';
      ctx.fillText('CHAIN', baseX + rowW + 12, r.e.y - 9);
    }
  }
  ctx.globalAlpha = 1;

  // rack row (always on screen)
  drawRackRow();

  // hurt flash / death vignette
  if (CB.hurtFlash > 0) {
    CB.hurtFlash = Math.max(0, CB.hurtFlash - 0.045);
    const hg = ctx.createRadialGradient(W / 2, H / 2, 220, W / 2, H / 2, 720);
    hg.addColorStop(0, 'rgba(255,60,40,0)');
    hg.addColorStop(1, `rgba(255,60,40,${0.42 * CB.hurtFlash})`);
    ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
  }
  if (res.died && T >= res.duration - 0.05) {
    const dg = ctx.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, 720);
    dg.addColorStop(0, 'rgba(120,20,20,0)');
    dg.addColorStop(1, 'rgba(120,20,20,0.55)');
    ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
  }
  // wave clock bar
  const prog = Math.min(1, T / res.duration);
  ctx.fillStyle = '#0a262c'; ctx.fillRect(0, H - 4, W, 4);
  ctx.fillStyle = '#57e6c9'; ctx.fillRect(0, H - 4, W * prog, 4);
}
function drawDolphin(x, y, angle, inv) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.globalAlpha = inv ? 0.55 + 0.35 * Math.sin(Date.now() / 40) : 1;
  ctx.shadowColor = '#57e6c9'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#57e6c9';
  ctx.beginPath();
  ctx.moveTo(24, 0);
  ctx.quadraticCurveTo(6, 12, -10, 9);
  ctx.quadraticCurveTo(-2, 0, -10, -9);
  ctx.quadraticCurveTo(6, -12, 24, 0);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0b4a44';
  ctx.beginPath();
  ctx.moveTo(2, -1); ctx.lineTo(-14, -12); ctx.lineTo(-9, -1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#eafffb';
  ctx.beginPath(); ctx.arc(15, -3, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawRackRow() {
  const w = 6 * SLOT_W + 20;
  ctx.fillStyle = '#03131acc';
  rr(RACK_X, RACK_Y, w, RACK_H, 10); ctx.fill();
  ctx.strokeStyle = '#134149'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#3e7f79'; ctx.font = '700 8px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('RACK · ORDER = ROUTING', RACK_X + 12, RACK_Y + 14);
  for (let i = 0; i < 6; i++) {
    const x = RACK_X + 10 + i * SLOT_W, y = RACK_Y + 24, s = SLOT_W - 8, h = 74;
    const id = CB.opts.rack[i];
    const glow = CB.glows[i] || 0;
    ctx.fillStyle = id ? '#0a2931' : '#061a20';
    rr(x, y, s, h, 7); ctx.fill();
    ctx.strokeStyle = glow > 0.05 ? '#f2c14e' : id ? '#1d5a64' : '#123c44';
    ctx.lineWidth = glow > 0.1 ? 2 : 1; ctx.stroke();
    if (glow > 0.05) {
      ctx.globalAlpha = glow * 0.22; ctx.fillStyle = '#f2c14e';
      rr(x, y, s, h, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#2c5f63'; ctx.font = '600 7px ui-monospace,Menlo,monospace';
    ctx.textAlign = 'left'; ctx.fillText(String(i + 1), x + 4, y + 9);
    if (id) {
      const it = ITEMS[id];
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = it.kind === 'K' ? '#8bf5e4' : it.kind === 'O' ? '#f2c14e' : '#eafffb';
      ctx.font = '700 20px ui-monospace,Menlo,monospace';
      ctx.fillText(it.glyph, x + s / 2, y + 30);
      ctx.fillStyle = '#6fa5a0'; ctx.font = '600 7px ui-monospace,Menlo,monospace';
      ctx.fillText(it.name.split(' ')[0].toUpperCase(), x + s / 2, y + 53);
      ctx.fillStyle = '#2c5f63'; ctx.font = '600 6px ui-monospace,Menlo,monospace';
      ctx.fillText(it.kind === 'S' ? 'SOURCE' : it.kind === 'K' ? 'SINK' : 'ORDER', x + s / 2, y + 64);
    } else {
      ctx.fillStyle = '#1d464c'; ctx.font = '600 10px ui-monospace,Menlo,monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('EMPTY', x + s / 2, y + h / 2);
    }
  }
  // decay glows
  for (let i = 0; i < 6; i++) CB.glows[i] = Math.max(0, CB.glows[i] - 0.035);
  ctx.textBaseline = 'alphabetic';
}

function orderLineHTML(order, cls) {
  const glyphs = (order || []).map((id) => id
    ? `<span class="g" title="${esc(ITEMS[id].name)}">${ITEMS[id].glyph}</span>`
    : `<span class="empty">·</span>`).join('');
  return `<div class="order-line ${cls || ''}"><span class="lbl">${cls === 'best' ? 'BEST' : cls === 'worst' ? 'WORST' : 'YOURS'}</span>${glyphs || '<span class="empty">·</span>'}</div>`;
}
function itemName(id) { return ITEMS[id] ? ITEMS[id].name : '—'; }

function describeSlot(st) {
  const it = ITEMS[st.id];
  if (!it) return { main: '—', did: '' };
  if (it.kind === 'S') {
    return { main: '+' + fmt(st.added) + ' chain', did: `fired on ${st.fires}/${st.seen} kills${st.hollow ? ` · ${st.hollow} hollow` : ''}` };
  }
  if (it.kind === 'O') {
    if (it.order === 'double') return { main: `${st.orderCount}× doubled`, did: 'the next slot resolved twice' };
    const names = Object.keys(st.copiesOf || {}).map(itemName).join(', ');
    return { main: `${st.copyCount}× copied`, did: `re-ran ${names || 'nothing'} immediately` };
  }
  const out = it.out === 'echo' ? `${st.echo} echoes`
    : it.out === 'gale' ? `${st.gale} weak echoes`
    : it.out === 'barrier' ? `${st.barrier} barrier`
    : it.out === 'vault' ? `${fmt(st.pearls)} pearls banked`
    : `${fmt(st.pearls)} pearls`;
  return { main: `${fmt(st.spent)} chain`, did: `fed on ${st.fires}/${st.seen} kills${st.hollow ? ` · ${st.hollow} hollow` : ''}`, out };
}
function fuelHTML(res) {
  const order = [['overkill', 'OVERKILL', '#ff7a6b'], ['bigHP', 'BIG HP', '#b78cff'], ['family', 'FAMILY', '#6fe08a'], ['pace', 'PACE', '#57e6c9'], ['safe', 'SAFE WATER', '#f2c14e'], ['generic', 'SOURCES', '#7fb8b1'], ['base', 'THE KILL ITSELF', '#40606a']];
  const total = res.fuelTotal || 1;
  return `<div class="fuel">${order.map(([k, label, col]) => {
    const v = res.fuel[k] || 0;
    const p = total ? Math.round(1000 * v / total) / 10 : 0;
    return `<div class="fuel-row ${k}"><span>${label}</span><div class="fuel-bar"><i style="width:${p}%;background:${col}"></i></div><span class="v">${p.toFixed(1)}%</span></div>`;
  }).join('')}</div>`;
}

  }
  const n = SIM.uniqueOrders(rep.rack.filter(Boolean)).length;
  const sampled = rep.wave >= 7 && n > 120;
  return `<p>Re-run this exact wave, seed, rack and pilot once per permutation of the six slots. ${sampled ? `This wave is slow, so the lab takes 120 random orders plus a greedy local search.` : ``} The sim is a pure function, so this is the same kill layer you just watched.</p>
    <button data-act="compare">COMPARE ${sampled ? '120 + LOCAL SEARCH' : n + ' ORDERS'}</button>`;
}
function startCompare(rep) {
  if (!rep || rep.compareRunning || rep.comparison) return;
  rep.compareRunning = true;
  rep.progress = { pct: 0, tested: 0, total: 1 };
  refreshReportPanels(rep);
  const plan = SIM.makePermPlan({
    wave: rep.wave, rack: rep.rack, seed: rep.seed,
    upgrades: rep.upgrades, hp: rep.hpStart, step: 0.1,
  });
  rep.plan = plan;
  const step = () => {
    if (!rep.compareRunning) return;
    const p = plan.runBatch(24);
    rep.progress = p;
    const bar = document.getElementById('cmpProg');
    const num = document.getElementById('cmpPnum');
    if (bar) bar.style.width = Math.round(p.pct * 100) + '%';
    if (num) num.textContent = `TESTING ORDERS · ${p.tested} / ${p.total}`;
    if (p.done) {
      rep.comparison = plan.result();
      rep.compareRunning = false; rep.plan = null;
      refreshReportPanels(rep);
      return;
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function refreshReportPanels(rep) {
  if (RUN.lastReport !== rep) return;
  const panel = document.querySelector('.report-panel');
  if (panel) { panel.innerHTML = reportHTML(rep); return; }
  const overCmp = document.getElementById('overCmp');
  if (overCmp) overCmp.innerHTML = `<h3>ORDER COMPARISON · WAVE ${rep.wave}</h3>${compareBlockHTML(rep)}`;
}

        <p class="hint">Drag to reorder. Sources build chain, sinks spend it. Whatever is left at the end of the row banks as pearls (4 chain → 1).</p>
      </section>
      <section class="panel offers-panel">
        <h2>SHOP <small>3 offers · reroll 5 ◈</small></h2>
        <div class="offers">${offersHTML()}</div>
        <div class="btnrow" style="margin-top:9px">
          <button data-act="reroll" ${RUN.pearls >= 5 ? '' : 'disabled'}>REROLL · 5 ◈</button>
        </div>
        <h2>SERVICES</h2>
        <div class="btnrow">
          <button data-act="heal" ${RUN.pearls >= 15 && RUN.hp < 100 ? '' : 'disabled'}>HEAL 30 HP · 15 ◈</button>
          <button data-act="gun" ${RUN.pearls >= gunCost ? '' : 'disabled'}>GUN +2 DMG · ${gunCost} ◈</button>
        </div>
        <h2>NEXT WAVE FORECAST <small>same seed · same pilot</small></h2>
        <div class="fcast">${forecastHTML()}</div>
        <div class="rule-line"><b>RULES OF THE ROW.</b> A source mutates chain. A sink takes <i>min(chain, its cap)</i> and spends it in whole bites; the remainder flows on. A sink with nothing to spend flashes hollow. Keystone doubles the next slot; Mirror re-runs the previous one.</div>
      </section>
      <section class="panel report-panel">
        ${rep ? reportHTML(rep) : `<div class="placeholder"><span class="big">⌁</span><b>NO WAVE YET</b><span>Play wave 1 and this panel becomes the attribution table: per slot fires, chain added, chain spent, output produced — plus the fuel mix and the every-order comparison.</span></div>`}
      </section>
    </div>
    <footer class="shop-foot">
      <div class="foot-note">${RUN.wave === 1 ? 'Buy a starter rack or go in bare — the pilot flies, the rack is yours.' : `Wave ${RUN.wave - 1} booked. ${RUN.lastReport && RUN.lastReport.res.died ? 'The run is over.' : 'Rearranging is always free.'}`}</div>
      <button class="btn primary" data-act="beginwave">${RUN.wave === 20 ? 'FINAL WAVE 20' : 'BEGIN WAVE ' + RUN.wave} →</button>
    </footer>
  </div>`;
}
function showShop() {
  RUN.phase = 'shop';
  CB = null;
  hudEl.classList.add('hidden');
  screenEl.classList.remove('hidden');
  screenEl.innerHTML = shopHTML();
  screenEl.scrollTop = 0;
  updateSoundButtons();
}
function showTitle() {
  RUN.phase = 'title'; CB = null;
  hudEl.classList.add('hidden');
  screenEl.classList.remove('hidden');
  screenEl.innerHTML = `<div class="title">
    <div class="eyebrow">ICARUS · DESIGN TOY · v1</div>
    <h1>KILL <span>LAYER</span> LAB</h1>
    <p class="thesis">A kill is a hand you play automatically. The rack is the joker row. Order is routing.</p>
    <p class="sub">Every kill stamps a <b>CHAIN</b> from what it was made of — overkill, big HP, family, crowd pace, your health. Six slots resolve <b>left to right, once per kill</b>. Sources grow the chain; sinks spend it on <b>echoes</b>, <b>barrier</b> or <b>pearls</b>. Whichever sink comes first gets fed. Whatever is left at the end of the row banks as pearls.</p>
    <div class="how">
      <div><b>SOURCES BUILD</b>Sonar and Undertow always work. Harpoon's Gift turns overkill into chain; Big Game turns tanky kills into chain. Early enemies die in one shot, late ones are walled — <i>so the fuel changes.</i></div>
      <div><b>SINKS SPEND</b>Cleave buys echoes from chain. Kelp buys barrier. Ballast banks pearls now; Vault banks a better rate at wave end. A sink with nothing to feed flashes hollow — that stall is the whole lesson.</div>
      <div><b>ORDER IS ROUTING</b>The report re-runs your exact wave for every permutation of your rack and tells you your percentile. If a different order makes more kills, the shop tells you.</div>
    </div>
    <div class="beginrow">
      <button class="btn primary" data-act="begin">BEGIN RUN</button>
      <button data-soundlabel data-act="sound">SOUND ON</button>
      <span class="tiny">20 waves · 6 slots · 17 items · no install, no network</span>
    </div>
    <p class="tiny">The dolphin is flown by a scripted dodging pilot — deterministic, so the comparison is honest. You choose the rack, the shop and the order. <span class="kbd">F</span> debug panel · <span class="kbd">M</span> mute</p>
  </div>`;
  updateSoundButtons();
}
function showRunOver(win) {
  RUN.phase = 'over';
  CB = null;
  hudEl.classList.add('hidden');
  screenEl.classList.remove('hidden');
  const rep = RUN.lastReport;
  const items = Object.entries(RUN.itemTotals).sort((a, b) => (b[1].added + b[1].spent) - (a[1].added + a[1].spent));
  const itemRows = items.map(([id, a]) => `<tr><td><span style="font-size:14px">${ITEMS[id].glyph}</span> ${esc(ITEMS[id].name)}</td><td>${a.waves}</td><td>${fmt(a.added)}</td><td>${fmt(a.spent)}</td><td>${a.echo + a.gale}</td><td>${a.barrier}</td><td>${fmt(a.pearls)}</td></tr>`).join('');
  screenEl.innerHTML = `<div class="runover ${win ? 'win' : ''}">
    <div class="eyebrow">${win ? 'ALL 20 WAVES CLEARED' : 'RUN OVER · DIED ON WAVE ' + rep.wave}</div>
    <h1>${win ? 'THE ROW HOLDS' : 'THE CHAIN BROKE'}</h1>
    <p class="sub">${win ? 'Wave 20 survived. The rack you built outran the curve.' : 'The rack could not keep the chain fed at the pressure this wave brought. That is the build decision showing itself.'}</p>
    <div class="totals">
      <div class="tot"><b>${fmt(RUN.totals.kills)}</b><span>kills</span></div>
      <div class="tot cyan"><b>${fmt(RUN.totals.echoes)}</b><span>echo kills</span></div>
      <div class="tot gold"><b>${fmt(RUN.totals.pearls)}</b><span>pearls earned</span></div>
      <div class="tot"><b>${win ? 20 : rep.wave}</b><span>waves deep</span></div>
    </div>
    <div class="two">
      <div class="card">
        <h3>PER-ITEM CONTRIBUTION · ALL RUN</h3>
        <table><thead><tr><th>item</th><th>waves</th><th>+chain</th><th>−chain</th><th>echo</th><th>barr</th><th>◈</th></tr></thead><tbody>${itemRows || '<tr><td colspan="7">No items owned. Bare rack, bold choice.</td></tr>'}</tbody></table>
      </div>
      <div class="card" id="overCmp">
        <h3>ORDER COMPARISON · WAVE ${rep.wave}</h3>
        ${compareBlockHTML(rep)}
      </div>
    </div>
    <div class="acts">
      <button class="btn primary" data-act="restart">NEW RUN</button>
      <button data-act="review">REVIEW WAVE ${rep.wave} REPORT</button>
    </div>
  </div>`;
  updateSoundButtons();
}
function showReview() {
  // reopen the shop view on the final wave report, no purchases needed
  RUN.phase = 'shop';
  screenEl.innerHTML = shopHTML();
  updateSoundButtons();
}

/* ------------------------------------------------------------------ *
 * actions / dragging
 * ------------------------------------------------------------------ */
function buy(id) {
  const it = ITEMS[id];
  if (RUN.pearls < it.price) return;
  let dest = null;
  const ri = RUN.rack.indexOf(null);
  if (ri >= 0) { RUN.rack[ri] = id; dest = 'rack'; }
  else { const bi = RUN.bench.indexOf(null); if (bi < 0) return; RUN.bench[bi] = id; dest = 'bench'; }
  RUN.pearls -= it.price;
  showShop();
}
function sellAt(zone, idx) {
  const arr = zone === 'rack' ? RUN.rack : RUN.bench;
  const id = arr[idx];
  if (!id) return;
  arr[idx] = null;
  RUN.pearls += Math.floor(ITEMS[id].price / 2);
  showShop();
}
function handleDrop(d, target) {
  if (!target) return;
  if (target === 'sell') { sellAt(d.zone, d.idx); return; }
  const [zone, idxS] = target.split(':');
  const idx = +idxS;
  const srcArr = d.zone === 'rack' ? RUN.rack : RUN.bench;
  const dstArr = zone === 'rack' ? RUN.rack : RUN.bench;
  const tmp = dstArr[idx];
  dstArr[idx] = srcArr[d.idx];
  srcArr[d.idx] = tmp;
  showShop();
}
screenEl.addEventListener('click', (e) => {
  const sell = e.target.closest('[data-sell]');
  if (sell) { const [z, i] = sell.dataset.sell.split(':'); sellAt(z, +i); return; }
  const buyBtn = e.target.closest('[data-buy]');
  if (buyBtn) { buy(buyBtn.dataset.buy); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'begin') { newRun(); }
  else if (a === 'beginwave') {
    if (RUN.phase !== 'shop') return;
    const opts = { wave: RUN.wave, rack: RUN.rack.slice(), seed: waveSeed(RUN.wave), upgrades: Object.assign({}, RUN.upgrades), hp: Math.max(1, RUN.hp) };
    startCombat(opts);
  } else if (a === 'reroll') {
    if (RUN.pearls < 5) return;
    RUN.pearls -= 5; RUN.rerolls++; rollOffers(); showShop();
  } else if (a === 'heal') {
    if (RUN.pearls < 15 || RUN.hp >= 100) return;
    RUN.pearls -= 15; RUN.hp = Math.min(100, RUN.hp + 30); showShop();
  } else if (a === 'gun') {
    const cost = 12 + 2 * RUN.gunBuys;
    if (RUN.pearls < cost) return;
    RUN.pearls -= cost; RUN.gunBuys++; RUN.upgrades.gunDamage += 2; showShop();
  } else if (a === 'sound') { AU.toggle(); }
  else if (a === 'newrun' || a === 'restart') { showTitle(); }
  else if (a === 'review') { showReview(); }
  else if (a === 'compare') { startCompare(RUN.lastReport); }
  else if (a === 'preset-fuel') {
    RUN.rack = pad(['harpoon', 'biggame', 'safewater', 'sonar', 'cleave', 'kelp']);
    RUN.bench = pad([]); showShop();
  }
});

let DRAG = null;
function dragStart(e) {
  const chip = e.target.closest('[data-drag]');
  if (!chip || e.target.closest('[data-sell]')) return;
  const [zone, idxS] = chip.dataset.drag.split(':');
  const idx = +idxS;
  const arr = zone === 'rack' ? RUN.rack : RUN.bench;
  if (!arr[idx]) return;
  const ghost = document.createElement('div');
  ghost.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);font:700 30px ui-monospace,Menlo,monospace;color:#f2c14e;filter:drop-shadow(0 0 10px #57e6c9);';
  ghost.textContent = ITEMS[arr[idx]].glyph;
  ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
  document.body.appendChild(ghost);
  DRAG = { zone, idx, ghost, sx: e.clientX, sy: e.clientY, moved: false };
  e.preventDefault();
}
function dragMove(e) {
  if (!DRAG) return;
  DRAG.moved = DRAG.moved || Math.hypot(e.clientX - DRAG.sx, e.clientY - DRAG.sy) > 4;
  DRAG.ghost.style.left = e.clientX + 'px'; DRAG.ghost.style.top = e.clientY + 'px';
  document.querySelectorAll('.slot.drop,.sell-bin.drop').forEach((el) => el.classList.remove('drop'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const drop = el && el.closest('[data-drop]');
  if (drop) drop.classList.add('drop');
}
function dragEnd(e) {
  if (!DRAG) return;
  const d = DRAG; DRAG = null;
  d.ghost.remove();
  document.querySelectorAll('.slot.drop,.sell-bin.drop').forEach((el) => el.classList.remove('drop'));
  if (!d.moved) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const drop = el && el.closest('[data-drop]');
  if (drop) handleDrop(d, drop.dataset.drop);
}
screenEl.addEventListener('pointerdown', dragStart);
window.addEventListener('pointermove', dragMove);
window.addEventListener('pointerup', dragEnd);

/* ------------------------------------------------------------------ *
 * main loop + fit
 * ------------------------------------------------------------------ */
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();

let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
  if (RUN.phase === 'combat' && CB) combatFrame(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') { RUN.showDebug = !RUN.showDebug; }
  if (e.key === 'm' || e.key === 'M') AU.toggle();
});

/* ------------------------------------------------------------------ *
 * public API
 * ------------------------------------------------------------------ */
window.KILLLAB = {
  VERSION: 'kill-layer-lab v1',
  simulate: SIM.simulate,
  permutations: SIM.permutations,
  state() {
    return {
      phase: RUN.phase, wave: RUN.wave, hp: RUN.hp, pearls: RUN.pearls,
      rack: RUN.rack.slice(), bench: RUN.bench.slice(), upgrades: Object.assign({}, RUN.upgrades),
      totals: Object.assign({}, RUN.totals),
      lastReport: RUN.lastReport ? {
        wave: RUN.lastReport.wave, seed: RUN.lastReport.seed, rack: RUN.lastReport.rack.slice(),
        kills: RUN.lastReport.res.kills, echoes: RUN.lastReport.res.echoes,
        pearls: RUN.lastReport.res.pearls, died: RUN.lastReport.res.died,
        comparison: RUN.lastReport.comparison ? {
          tested: RUN.lastReport.comparison.tested, spreadPct: RUN.lastReport.comparison.spreadPct,
          yoursPct: RUN.lastReport.comparison.yoursPct, deaths: RUN.lastReport.comparison.deaths,
          best: RUN.lastReport.comparison.best.order, worst: RUN.lastReport.comparison.worst.order,
        } : null,
      } : null,
    };
  },
  dev: {
    setRun(patch) {
      Object.assign(RUN, patch || {});
      if (patch && patch.rack) RUN.rack = pad(patch.rack);
      if (patch && patch.bench) RUN.bench = pad(patch.bench);
      rollOffers(); showShop();
    },
    openShop() { RUN.lastReport = null; rollOffers(); showShop(); },
    playWave(opts) {
      opts = opts || {};
      const wave = opts.wave || RUN.wave;
      const o = {
        wave,
        rack: opts.rack ? pad(opts.rack) : RUN.rack.slice(),
        seed: opts.seed == null ? waveSeed(wave) : opts.seed >>> 0,
        upgrades: opts.upgrades ? Object.assign({ gunDamage: 0 }, opts.upgrades) : Object.assign({}, RUN.upgrades),
        hp: opts.hp == null ? RUN.hp : opts.hp,
      };
      RUN.wave = wave; RUN.hp = o.hp; RUN.rack = o.rack; RUN.upgrades = o.upgrades;
      RUN.lastReport = null;
      startCombat(o);
      return { wave, sim: { kills: SIM.simulate({ wave, rack: o.rack, seed: o.seed, upgrades: o.upgrades, hp: o.hp }).kills } };
    },
    skip() { if (CB) CB.playT = CB.res.duration + 2; },
    finish() { if (CB) { CB.playT = CB.res.duration + 2; } },
    debug() {
      return {
        fps, phase: RUN.phase,
        enemies: CB ? CB.enemiesOnScreen : 0,
        playT: CB ? CB.playT : 0,
        duration: CB ? CB.res.duration : 0,
        kills: CB ? CB.counters.kills : (RUN.lastReport ? RUN.lastReport.res.kills : 0),
        echoes: CB ? CB.counters.echoKills : 0,
        receipts: CB ? CB.receipts.length : 0,
        fpsSample: fps,
        lastReport: RUN.lastReport ? { wave: RUN.lastReport.wave, kills: RUN.lastReport.res.kills, spread: RUN.lastReport.comparison ? RUN.lastReport.comparison.spreadPct : null } : null,
      };
    },
    state: () => RUN,
    compare(rep) { startCompare(rep || RUN.lastReport); },
  },
};

/* boot */
showTitle();
updateSoundButtons();
})();

</script>
